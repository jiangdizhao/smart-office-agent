name: Vision Edge Service Check

on:
  push:
    branches:
      - Vision-Edge-Server
    paths:
      - "vision-edge-server/**"
      - ".github/workflows/vision-edge-phase0-check.yml"
  pull_request:
    paths:
      - "vision-edge-server/**"
      - ".github/workflows/vision-edge-phase0-check.yml"

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision-edge-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<2" "opencv-python-headless==4.9.0.80" fastapi uvicorn pydantic PyYAML httpx websockets pytest
      - name: Compile service and scripts
        run: python -m compileall app scripts
      - name: Run unit and contract tests
        run: python -m pytest -q
