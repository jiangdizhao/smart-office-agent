service_name: rtx-vision-edge-server
version: 0.1.1
phase: phase0_camera_probe_v2

server:
  host: 0.0.0.0
  port: 8015
  heartbeat_seconds: 5
  log_level: INFO
  cors_origins:
    - "*"

camera:
  enabled: true
  probe_on_startup: true
  device_index: 1
  requested_width: 3840
  requested_height: 2160
  probe_modes:
    - backend: DSHOW
      fourcc: MJPG
      fps: 30
    - backend: DSHOW
      fourcc: MJPG
      fps: 15
    - backend: DSHOW
      fourcc: YUY2
      fps: 15
    - backend: MSMF
      fourcc: MJPG
      fps: 30
    - backend: MSMF
      fourcc: MJPG
      fps: 15
  warmup_frames: 2
  sample_frames: 6
  ready_min_measured_fps: 10
  degraded_min_measured_fps: 3
  inter_attempt_delay_seconds: 0.25

gpu:
  probe_on_startup: true
  require_cuda: false
  nvidia_smi_timeout_seconds: 5
