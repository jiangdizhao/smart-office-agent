service_name: rtx-vision-edge-server
version: 0.6.0
phase: phase4_identity_session_fusion

server:
  host: 0.0.0.0
  port: 8015
  heartbeat_seconds: 5
  log_level: INFO
  cors_origins:
    - "*"

camera:
  enabled: true
  probe_on_startup: false
  device_index: 1
  requested_width: 3840
  requested_height: 2160
  probe_modes:
    - backend: DSHOW
      fourcc: MJPG
      fps: 30
    - backend: DSHOW
      fourcc: MJPG
      fps: 15
    - backend: DSHOW
      fourcc: YUY2
      fps: 15
    - backend: MSMF
      fourcc: MJPG
      fps: 30
    - backend: MSMF
      fourcc: MJPG
      fps: 15
  warmup_frames: 2
  sample_frames: 6
  ready_min_measured_fps: 10
  degraded_min_measured_fps: 3
  inter_attempt_delay_seconds: 0.25
  runtime_backend: MSMF
  runtime_fourcc: AUTO
  runtime_fps: 30
  reconnect_delay_seconds: 1
  reopen_after_consecutive_failures: 10
  stats_window_frames: 300

gpu:
  probe_on_startup: true
  require_cuda: false
  nvidia_smi_timeout_seconds: 5

vision:
  enabled: true
  start_on_startup: true
  global_width: 960
  global_height: 540

detection:
  enabled: true
  model_path: models/yolox_nano.onnx
  input_width: 416
  input_height: 416
  inference_hz: 12
  score_threshold: 0.10
  nms_threshold: 0.45
  person_class_id: 0
  max_detections: 20
  providers:
    - CUDAExecutionProvider
    - CPUExecutionProvider
  require_cuda: true

reid:
  enabled: true
  model_path: models/osnet_x0_25.onnx
  input_width: 128
  input_height: 256
  providers:
    - CUDAExecutionProvider
    - CPUExecutionProvider
  require_cuda: true
  allow_histogram_fallback: true
  crop_margin: 0.02
  min_crop_width: 32
  min_crop_height: 80
  histogram_h_bins: 16
  histogram_s_bins: 16

tracking:
  enabled: true
  low_threshold: 0.10
  high_threshold: 0.50
  new_track_threshold: 0.60
  confirm_hits: 3
  confirm_window_frames: 5
  lost_timeout_seconds: 2.0
  removed_retention_seconds: 3.0
  gallery_size: 10
  feature_ema_alpha: 0.10
  iou_weight: 0.45
  motion_weight: 0.20
  appearance_weight: 0.35
  first_stage_max_cost: 0.82
  second_stage_max_cost: 0.78
  tentative_max_cost: 0.72
  max_center_distance: 0.25
  lost_max_center_distance: 0.40
  minimum_iou_gate: 0.01
  mahalanobis_gate: 18.47
  appearance_similarity_gate: 0.72

presence:
  enter_confirm_frames: 2
  engage_confirm_frames: 3
  left_timeout_seconds: 1.5
  engagement_min_area_ratio: 0.08
  engagement_zone:
    - [0.05, 0.05]
    - [0.95, 0.05]
    - [0.95, 1.0]
    - [0.05, 1.0]

primary:
  acquire_stable_seconds: 0.5
  challenger_margin: 0.20
  challenger_hold_seconds: 1.0
  lost_lock_seconds: 2.0
  area_full_scale_ratio: 0.25
  dwell_full_scale_seconds: 5.0
  stability_full_scale_hits: 20
  target_x: 0.5
  target_y: 0.85

face:
  enabled: true
  model_path: models/face_detection_yunet_2023mar.onnx
  inference_hz: 7.5
  score_threshold: 0.65
  nms_threshold: 0.30
  top_k: 5000
  max_tracks_per_cycle: 4
  person_crop_margin: 0.04
  max_face_center_y_ratio: 0.76

  recognition_min_face_width_pixels: 56
  recognition_min_face_height_pixels: 56
  recognition_min_sharpness: 12
  recognition_min_brightness: 20
  recognition_max_brightness: 240
  recognition_min_frontal_score: 0.30
  recognition_min_quality_score: 0.40
  recognition_stable_frames: 1

  min_face_width_pixels: 64
  min_face_height_pixels: 64
  min_sharpness: 22
  sharpness_full_scale: 160
  min_brightness: 25
  max_brightness: 235
  max_abs_roll_degrees: 32
  max_nose_offset_ratio: 0.45
  min_frontal_score: 0.45
  min_quality_score: 0.52
  ready_stable_frames: 2
  stale_seconds: 1.5

identity:
  enabled: true
  model_path: models/face_recognition_sface_2021dec.onnx
  database_path: data/identity/visitor_identities.sqlite3
  cosine_threshold: 0.45
  minimum_margin: 0.03
  confirm_observations: 2
  adaptive_confirmation_enabled: true
  high_similarity_threshold: 0.60
  medium_similarity_threshold: 0.45
  low_similarity_threshold: 0.38
  high_minimum_margin: 0.015
  medium_minimum_margin: 0.03
  low_minimum_margin: 0.05
  high_confirm_observations: 1
  medium_confirm_observations: 2
  low_confirm_observations: 3
  top_k_samples: 3
  recognition_interval_seconds: 0.20
  enrollment_min_quality: 0.52
  enrollment_capture_seconds: 3.0
  enrollment_prebuffer_seconds: 1.0
  enrollment_target_samples: 8
  enrollment_min_samples: 3
  enrollment_max_selected_samples: 5
  enrollment_duplicate_similarity: 0.995
  recent_samples_per_track: 40
  max_samples_per_identity: 12
  require_explicit_consent: true

visitor_session:
  enabled: true
  ttl_seconds: 60
  max_face_embeddings: 8
  max_body_embeddings: 8
  face_high_similarity: 0.56
  face_medium_similarity: 0.44
  face_minimum_margin: 0.03
  body_high_similarity: 0.82
  body_medium_similarity: 0.72
  body_minimum_margin: 0.04
  medium_confirmations: 2
  body_only_confirmations: 3
  body_only_max_age_seconds: 12
  max_center_distance: 0.65

debug:
  enabled: true
  preview_width: 960
  preview_height: 540
  preview_fps: 10
  jpeg_quality: 80
  draw_zone: true
  draw_raw_detections: false
  draw_track_trails: true
  draw_lost_tracks: true
  draw_faces: true
  draw_face_landmarks: true
  draw_identity: true
  draw_visitor_session: true
